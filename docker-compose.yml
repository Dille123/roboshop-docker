networks:
  default:
    driver: bridge
    name: roboshop

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq: ## docker volume create

services:

  mongodb:
    volumes:
      - mongodb:/data/db
    image: nagavarapudille/mongodb:v1
    container_name: mongodb

  catalogue:
    image: nagavarapudille/catalogue:v1
    container_name: catalogue
    depends_on:
      - mongodb

  redis:
    volumes:
      - redis:/data
    image: redis:7.0
    container_name: redis

  user:
    image: nagavarapudille/user:v1
    container_name: user
    depends_on:
      - redis
      - mongodb

  cart:
    image: nagavarapudille/cart:v1
    container_name: cart
    depends_on:
      - catalogue
      - redis

  mysql:
    volumes:
      - mysql:/var/lib/mysql
    image: nagavarapudille/mysql:v1
    container_name: mysql

  shipping:
    image: nagavarapudille/shipping:v1
    container_name: shipping
    depends_on:
      - mysql
      - cart

  rabbitmq:
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123

  payment:
    image: nagavarapudille/payment:v1
    container_name: payment
    environment:
      CART_HOST: cart
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
      - rabbitmq
      - cart
      - user

  frontend:
    image: nagavarapudille/frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment